name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (Strict TypeScript)
        run: pnpm typecheck

      - name: Build Extension (Vite + CRXJS)
        run: pnpm build

      - name: Validate Manifest & Output
        run: |
          test -f dist/manifest.json
          test -f dist/service-worker-loader.js
          echo "Manifest V3 build verified successfully."
